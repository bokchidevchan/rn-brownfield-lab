apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../../rn")
    reactNativeDir = file("../../rn/node_modules/react-native")
    codegenDir = file("../../rn/node_modules/@react-native/codegen")
    cliFile = file("../../rn/node_modules/react-native/cli.js")
    entryFile = file("../../rn/index.js")
    bundleAssetName = "index.android.bundle"
    autolinkLibrariesWithApp()
}

android {
    namespace "com.example.bench"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.example.bench"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        if (project.hasProperty("abiFilters")) {
            ndk { abiFilters.addAll(project.property("abiFilters").split(",")) }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")

    // 웹뷰는 별도 의존성이 없습니다. android.webkit.WebView 가 OS 에 들어 있습니다.
    // 이것 하나가 앱 용량 비교의 결론을 미리 말해 줍니다.
}
