pluginManagement {
    includeBuild("../host/node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    // Re.Pack 은 네이티브 모듈(ScriptManager)을 포함합니다.
    // autolinking 이 그걸 찾아야 원격 번들 로딩이 동작합니다.
    ex.autolinkLibrariesFromCommand(
        ["node", "../host/node_modules/react-native/cli.js", "config"],
        file("../host"),
    )
}

includeBuild("../host/node_modules/@react-native/gradle-plugin")

rootProject.name = "MfHost"
include ":app"
