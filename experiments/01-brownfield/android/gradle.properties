org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.configureondemand=true

android.useAndroidX=true

# RN 을 소스에서 빌드할 때 컴파일할 ABI 목록입니다.
# RN 0.76 은 기본적으로 미리 빌드된 바이너리를 받아 쓰므로 이 값만으로는 APK 에서
# ABI 가 빠지지 않습니다. 그건 app/build.gradle 의 abiFilters 쪽입니다.
# 처음 볼 때 헷갈리는 지점이라 두 곳에 같이 적어 둡니다.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Old Architecture 로 고정합니다.
# 기존 앱 마이그레이션은 대부분 여기서 출발해서, 이후 true 로 바꿔 가며 비교합니다.
newArchEnabled=false

# 어느 JS 엔진을 쓸 것인가. 엔진을 쓸지 말지가 아닙니다.
#
# true : Hermes. 빌드할 때 hermesc 가 JS 를 바이트코드로 미리 컴파일하고,
#        앱은 libhermes.so 로 그 바이트코드를 실행합니다.
# false: JSC. 번들이 JS 텍스트 그대로 들어가고,
#        앱 시작 시점에 libjsc.so 가 파싱하고 컴파일합니다.
#
# 명령줄로도 덮어쓸 수 있습니다: ./gradlew assembleRelease -PhermesEnabled=false
hermesEnabled=true
